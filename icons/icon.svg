<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2f8f"/>
      <stop offset="1" stop-color="#0f0c29"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8ff78"/>
      <stop offset="1" stop-color="#1dd1a1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="400" cy="90" r="120" fill="#6a4cff" opacity=".35"/>
  <circle cx="110" cy="430" r="110" fill="#ff5fa2" opacity=".25"/>
  <!-- ground -->
  <rect x="80" y="404" width="352" height="30" rx="8" fill="#4a3226"/>
  <rect x="80" y="404" width="352" height="6" fill="#63d471"/>
  <!-- blocks -->
  <g stroke="#0f0c29" stroke-opacity=".25" stroke-width="4">
    <rect x="96" y="336" width="320" height="64" rx="16" fill="#54a0ff"/>
    <rect x="96" y="336" width="320" height="28" rx="16" fill="url(#gloss)" stroke="none"/>
    <rect x="96" y="268" width="320" height="64" rx="16" fill="#feca57"/>
    <rect x="96" y="268" width="320" height="28" rx="16" fill="url(#gloss)" stroke="none"/>
    <rect x="96" y="200" width="320" height="64" rx="16" fill="#ff6b6b"/>
    <rect x="96" y="200" width="320" height="28" rx="16" fill="url(#gloss)" stroke="none"/>
  </g>
  <!-- sprout -->
  <path d="M256 196 C256 150 256 130 256 108" stroke="url(#leaf)" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M256 150 C220 150 190 130 186 92 C226 92 254 112 256 150 Z" fill="url(#leaf)"/>
  <path d="M256 122 C292 122 322 102 326 64 C286 64 258 84 256 122 Z" fill="url(#leaf)"/>
  <!-- coin -->
  <circle cx="376" cy="122" r="40" fill="#ffd166" stroke="#e0a800" stroke-width="6"/>
  <text x="376" y="138" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="44" fill="#8a5a00">₩</text>
</svg>
